allowBuilds:
  esbuild: true
  koffi: true
# pnpm 11 defaults minimum-release-age to 1440 minutes (one day); restated here
# so the policy is explicit rather than inherited, without changing behaviour.
# Re-verified on the pinned pnpm@11.7.0 (2026-09-17): a bare project with no pnpm
# configuration at all still gates a package published an hour earlier, and the
# defaults table in its dist carries `"minimum-release-age": 24 * 60`.
# Before this key existed, `pnpm config get minimum-release-age` printed
# undefined: it reports explicit settings only, never built-in defaults, so
# that output must not be read as "no policy".
minimumReleaseAge: 1440
# This list tracks the pinned @deepseek-ai/dsh release (currently 0.1.7-rc.2,
# published 2026-09-24T14:18Z): every entry names that exact version, so each
# package is exempted only for this release and the policy still covers every
# other version. It must change in the same commit as every DSH version bump;
# otherwise install rewrites this file (or, with minimumReleaseAgeStrict on,
# refuses the fresh release), and stale entries keep naming versions nobody
# installs. The policy covers transitive dependencies too; with
# minimumReleaseAgeStrict off pnpm appends those names here by itself, so keep
# what it writes. scripts/validation/run-packed-smoke.mjs copies this list into
# its throwaway workspaces, so the packed smoke follows the same exemptions; the
# published host's wider closure is exempted there per exact @deepseek-ai
# name@version that pnpm reports as immature, and recorded as evidence.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-loop@0.1.7-rc.2'
  - '@deepseek-ai/dsh-agent@0.1.7-rc.2'
  - '@deepseek-ai/dsh-attachment@0.1.7-rc.2'
