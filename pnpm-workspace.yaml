allowBuilds:
  esbuild: true
  koffi: true
# pnpm 11 defaults minimum-release-age to 1440 minutes (one day); restated here
# so the policy is explicit rather than inherited, without changing behaviour.
# Re-verified on the pinned pnpm@11.7.0 (2026-09-17): a bare project with no pnpm
# configuration at all still gates a package published an hour earlier, and the
# defaults table in its dist carries `"minimum-release-age": 24 * 60`.
# Before this key existed, `pnpm config get minimum-release-age` printed
# undefined: it reports explicit settings only, never built-in defaults, so
# that output must not be read as "no policy".
minimumReleaseAge: 1440
# Exemptions from the policy above, as exact `name@version` entries. The list is
# empty because the pinned @deepseek-ai/dsh release (0.2.0-rc.2, published
# 2026-09-29) is more than a day old. Add entries only when bumping to a release
# published less than a day earlier, one per exact name@version so every other
# version stays covered, and remove them at the next bump. The policy covers
# transitive dependencies too; with minimumReleaseAgeStrict off pnpm appends
# immature names here by itself during install, so keep what it writes until
# that next bump. Keep the key even when the list is empty:
# scripts/validation/run-packed-smoke.mjs requires a string list and copies it
# into its throwaway workspaces, so the packed smoke follows the same
# exemptions. For the published host's wider closure the smoke exempts only the
# exact @deepseek-ai name@version entries pnpm reports as immature, and records
# them as evidence.
minimumReleaseAgeExclude: []
