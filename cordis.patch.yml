# dsh-slice-agent-loop bundle patch.
#
# Unlike an additive plugin, this one REPLACES the agent loop: `ctx.agents` holds
# exactly one factory, so the stock loop must be disabled or both fail loudly.
#
# Compaction is disabled with it. This loop's bounded rebuild does the same job,
# and `dsh-command-compact` injects `compact` — leaving the consumer mounted
# after its service is gone suspends that fiber forever.
#
# NOTE: the live compaction stack lives in each preset's own `compaction`
# isolate group, which a host-plane patch cannot reach. These two rows cover
# the host plane; to run without compaction under `standard` / `code` /
# `cordis`, author a preset without that group (see README). Since 20260811
# `token-meter` sits on the HOST plane, no longer inside that group — dropping
# the group no longer silently deletes ctx.tokenMeter with it.

- id: agent-loop
  disabled: true

# rc.1 名字;rc.2 改名 compaction-basic——两行都带,未命中的一行只 warn。
- id: compact-basic
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- insert:
    - id: slice-agent-loop
      name: '@dsh-external/dsh-slice-agent-loop'
