- insert:
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: settings
      name: '@deepseek-ai/dsh-settings-file'
      config:
        watch: false
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        personaPrefix: Packed plugin validation fixture.
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: session-persistence
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js process.env.DSH_VALIDATION_OUTPUT + '/sessions'
        compression: none
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
    - id: invariants
      name: '@deepseek-ai/dsh-invariants'
    - id: session-invariant
      name: '@deepseek-ai/dsh-session/invariant'
    - id: agent-loop-invariant
      name: '@deepseek-ai/dsh-agent-loop/invariant'
    - id: packed-runner
      name: '../../../runner.mjs'
      config:
        outputDir: !!js process.env.DSH_VALIDATION_OUTPUT

# The shipped bundle inserts the plugin with its defaults, and the default
# history.highWaterChars (300000) is never reached by this three-turn fixture,
# so the plugin would (correctly) append nothing. Profile patches apply after
# bundle layers, so this id-targeted row lowers the water marks and the smoke
# drives a real archive event through the published Loader, JSONL persistence
# and resume.
- id: slice-agent-loop
  config:
    history:
      highWaterChars: 600
      lowWaterChars: 300
      keepRecentChars: 1
