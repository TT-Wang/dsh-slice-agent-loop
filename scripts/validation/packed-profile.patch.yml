- insert:
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        personaPrefix: Packed plugin validation fixture.
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: session-persistence
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js process.env.DSH_VALIDATION_OUTPUT + '/sessions'
        compression: none
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
    - id: packed-runner
      name: '../../../runner.mjs'
      config:
        outputDir: !!js process.env.DSH_VALIDATION_OUTPUT

# The installed bundle supplies the current per-turn sealing defaults.
# Exercise that shipped configuration without overriding its history policy.
#
# No runtime invariant rows: 0.2.1 removed @deepseek-ai/dsh-invariants and every
# <package>/invariant module, and a row naming one fails to load. The runner
# checks each request against the durable surface and header itself.
