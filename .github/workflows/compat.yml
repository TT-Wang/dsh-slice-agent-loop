name: Peer compatibility
# The regular CI pins one supported DSH release. This job probes npm latest,
# first checking that it remains inside our explicitly declared peer ranges.
# A newer unsupported release must fail rather than produce a misleading green.
# Supporting it requires a reviewed manifest and runtime compatibility change.
#
# On 2026-09-25 npm `latest` lagged the pinned `next` release (0.1.7-rc.2):
# @deepseek-ai/dsh was tagged 0.1.5-rc.3 and most dsh-* packages far older.
# `pnpm up --latest` keeps a locked prerelease newer than `latest` (probed on
# pnpm 11.7.0 with dsh-util-values: 0.1.7-rc.2 stayed, "Already up to date"),
# so until `latest` moves past 0.1.7-rc.2 this job re-verifies the pinned release.
#
# It never touches the committed lockfile: the upgrade happens in the runner's
# working copy and is thrown away with it.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  newest-peers:
    name: newest published DSH peers (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Verify the declared Node 22 floor, the current Node 22 patch, and Node 24.
        node: ['22.19.0', '22.22.3', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - name: Upgrade DSH peers to latest
        run: pnpm up "@deepseek-ai/*" --latest
      - run: pnpm peers check
      - run: npm run check:peers
      - run: npm run check:docs
      - name: Record what actually resolved
        run: |
          {
            echo '### Resolved DSH versions'
            echo '```'
            pnpm ls --depth 0 --json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s)[0];for(const g of ["dependencies","devDependencies"])for(const [k,v] of Object.entries(t[g]??{}))if(k.startsWith("@deepseek-ai/"))console.log(`${k}@${v.version}`)})'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run check:build
      - run: npm run verify:packed
