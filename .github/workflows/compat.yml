name: Peer compatibility
# peerDependencies declare `^0.1.3-alpha.2`, but CI installs exactly one
# closure (pnpm-lock pins 0.1.3-alpha.2). This job tests the rest of the range
# the manifest promises: resolve the DSH peers to their newest published
# versions and run the same gates. It is expected to be the first thing that
# breaks when the host publishes an incompatible alpha — that is the point.
#
# It never touches the committed lockfile: the upgrade happens in the runner's
# working copy and is thrown away with it.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  newest-peers:
    name: newest published DSH peers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - name: Upgrade DSH peers to latest
        run: pnpm up "@deepseek-ai/*" --latest
      - name: Record what actually resolved
        run: |
          {
            echo '### Resolved DSH versions'
            echo '```'
            pnpm ls --depth 0 --json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s)[0];for(const g of ["dependencies","devDependencies"])for(const [k,v] of Object.entries(t[g]??{}))if(k.startsWith("@deepseek-ai/"))console.log(`${k}@${v.version}`)})'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:packed
