name: Peer compatibility
# The regular CI pins one supported DSH release. This job probes the newest
# published DSH release candidate, first checking that it remains inside our
# explicitly declared peer ranges. A newer unsupported release must fail rather
# than produce a misleading green. Supporting it requires a reviewed manifest and
# runtime compatibility change; run the source check in
# docs/dsh-0.2.0-compatibility.md ("Before upgrading the host") first.
#
# DSH publishes release candidates under npm's `next` dist-tag. On 2026-10-13
# the umbrella package @deepseek-ai/dsh had latest = next = 0.2.0-rc.2, but all
# 29 dsh-* devDependencies of this plugin had next = 0.2.0-rc.2 with a much
# older `latest` (0.0.1-rc.1 to 0.1.6-alpha.1). `pnpm up --latest` keeps a
# locked prerelease newer than `latest`, so that selector would only re-test
# the pinned version. The @deepseek-ai/dsh* packages therefore follow `next`. A
# tag selector keeps the exact specifiers that
# scripts/validation/run-packed-smoke.mjs reads, and a new `next` outside the
# peer range fails check:peers (probed on pnpm 11.7.0 on 2026-09-27 with the
# `alpha` tag: every dsh* devDependency became exactly 0.1.7-alpha.2 and
# check:peers failed).
#
# That failure is the designed signal, and it has fired once. 0.2.0-rc.2 reached
# `next` on 2026-09-29 while the peer range was still 0.1.7-only, and the
# scheduled runs of 2026-10-05 and 2026-10-12 failed at check:peers on all
# three Node versions. The remedy was the reviewed bump: the peer range and the
# host allowlist in scripts/validation/run-packed-smoke.mjs both had to admit
# 0.2.0-rc.2. Expect the same failure when the next release candidate or 0.2.0
# final reaches `next`.
#
# Alpha builds use the `alpha` tag (0.2.1-alpha.2 on 2026-10-13), which this
# job does not probe.
#
# @deepseek-ai/cordis stays on `latest`: its `next` (4.0.1-rc.4 on 2026-10-13)
# is older than `latest` (4.0.4). The `dsh*` pattern does not match it.
#
# When `next` is younger than pnpm's minimumReleaseAge (one day), `pnpm up`
# keeps the current version and exits 0 (probed on pnpm 11.7.0), so a release
# published less than a day before a run is first probed the following week.
# The "Record what actually resolved" step writes the resolved versions to the
# step summary. It runs before the checks, so a run that fails check:peers
# still names the new `next` version.
#
# It never touches the committed lockfile: the upgrade happens in the runner's
# working copy and is thrown away with it.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  newest-peers:
    name: newest published DSH peers (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Verify the declared Node 22 floor, the current Node 22 patch, and Node 24.
        node: ['22.19.0', '22.22.3', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - name: Upgrade DSH packages to npm next
        run: pnpm up '@deepseek-ai/dsh*@next'
      - name: Upgrade cordis to npm latest
        run: pnpm up @deepseek-ai/cordis --latest
      - name: Record what actually resolved
        run: |
          {
            echo '### Resolved DSH versions'
            echo '```'
            pnpm ls --depth 0 --json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s)[0];for(const g of ["dependencies","devDependencies"])for(const [k,v] of Object.entries(t[g]??{}))if(k.startsWith("@deepseek-ai/"))console.log(`${k}@${v.version}`)})'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm peers check
      - run: npm run check:peers
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run check:build
      - run: npm run verify:packed
