name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published-dsh:
    name: published DSH 0.1.7-rc.2 (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Verify the declared Node 22 floor, the current Node 22 patch, and Node 24.
        node: ['22.19.0', '22.22.3', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: npm run check:peers
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Rebuild and verify Git-install artifacts
        run: npm run check:build
      - name: Verify packed plugin through published DSH Loader
        run: npm run verify:packed
      # The peer range also admits the previous release candidate; install the
      # same tarball into that published host too.
      - name: Verify compatibility with published DSH 0.1.7-rc.1
        if: matrix.node == '22.22.3'
        run: npm run verify:packed
        env:
          SLICE_PACKED_DSH_VERSION: 0.1.7-rc.1
      # results/ is a committed evidence archive and 98% of what a Git install
      # downloads. Raising the ceiling should be a deliberate commit.
      - name: Tracked-bytes budget
        run: npm run check:size
