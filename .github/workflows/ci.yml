name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  published-dsh:
    name: published DSH 0.2.1-rc.2 (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Verify the declared Node 22 floor, the current Node 22 patch, and Node 24.
        node: ['22.19.0', '22.22.3', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: npm run check:peers
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Rebuild and verify Git-install artifacts
        run: npm run check:build
      - name: Verify packed plugin through published DSH Loader
        run: npm run verify:packed
      # The peer range also admits 0.2.0-rc.2, the previous supported host, so a
      # deployment can install this build before it switches hosts and can roll
      # the host back without repacking the plugin (sessions that 0.2.1 wrote
      # job or working-directory events into stay on 0.2.1; see
      # docs/dsh-0.2.1-compatibility.md). Install the same tarball into that
      # published host too. Everything above this step (types, tests, coverage)
      # runs against 0.2.1-rc.2 only.
      - name: Verify packed plugin on published DSH 0.2.0-rc.2
        if: matrix.node == '22.22.3'
        run: npm run verify:packed
        env:
          SLICE_PACKED_DSH_VERSION: 0.2.0-rc.2
      # A `dsh plugin add github:` install downloads a tarball of every tracked
      # file. Raw experiment data lives in GitHub releases, not the tree (see
      # results/README.md). Raising the 8 MiB ceiling should be a deliberate commit.
      - name: Tracked-bytes budget
        run: npm run check:size
