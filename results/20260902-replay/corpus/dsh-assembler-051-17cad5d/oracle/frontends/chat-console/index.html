<!doctype html>
<!-- chat-console — 装配默认前端(Franken UI / shadcn 观感):与该 preset agent 直接对话。
     接线走 host 同源 wire(session.create / session.prompt / events.mux)。 -->
<html lang="zh" class="uk-theme-zinc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{presetId}}</title>
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="_vendor/core.min.css">
<link rel="stylesheet" href="_vendor/utilities.min.css">
<script src="_vendor/core.iife.js" defer></script>
<script src="_vendor/assembler-sdk.js"></script>
<style>
  .dot{width:9px;height:9px;border-radius:9999px;background:hsl(var(--muted-foreground));flex:none;transition:background .3s}
  .dot.busy{background:hsl(var(--primary));animation:pulse 1.1s infinite}
  .dot.ok{background:#10a37f}
  @keyframes pulse{50%{opacity:.3}}
  .prewrap{white-space:pre-wrap;word-break:break-word}
  #box{resize:none;max-height:160px}
</style>
</head>
<body class="bg-background text-foreground min-h-screen flex flex-col">
<header class="sticky top-0 z-10 flex items-center gap-3 border-b border-border bg-card px-6 py-3">
  <div class="dot" id="dot"></div>
  <div>
    <div class="font-semibold">{{title}}</div>
    <div class="text-xs text-muted-foreground">preset {{presetId}} · dsh-assembler 装配</div>
  </div>
  <div class="flex-1"></div>
  <button class="uk-btn uk-btn-default uk-btn-sm" id="newBtn">新会话</button>
</header>
<div class="max-w-3xl mx-auto w-full px-5"><div class="uk-alert uk-alert-destructive mt-3" id="err" style="display:none"></div></div>
<main class="flex-1 overflow-y-auto py-6">
  <div class="max-w-3xl mx-auto px-5 flex flex-col gap-3" id="lane">
    <div class="text-center text-muted-foreground mt-24" id="empty">
      <div class="text-4xl mb-3">💬</div>
      这就是你刚装配好的 agent。<br>直接输入开始对话——零件与知识已随 preset 就位。
    </div>
  </div>
</main>
<footer class="border-t border-border bg-card px-5 py-4">
  <div class="max-w-3xl mx-auto flex gap-2 items-end">
    <textarea id="box" rows="1" class="uk-input flex-1" placeholder="对 agent 说点什么…(Enter 发送,Shift+Enter 换行)"></textarea>
    <button class="uk-btn uk-btn-primary" id="sendBtn">发送</button>
  </div>
  <div class="max-w-3xl mx-auto text-xs text-muted-foreground mt-2 text-center">{{requirement}}</div>
</footer>
<script>
const CFG = { presetId: '{{presetId}}', workdir: '{{workdir}}' };
let sessionId = null, ws = null, busy = false, agentBubble = null, toolRow = null;
const $ = (id) => document.getElementById(id);
const lane = $('lane'), dot = $('dot'), box = $('box'), sendBtn = $('sendBtn');

function showErr(m) { const e = $('err'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 8000); }
function setBusy(b) { busy = b; dot.className = 'dot ' + (b ? 'busy' : 'ok'); sendBtn.disabled = b; }

// wire 双代翻译在共享 SDK(_vendor/assembler-sdk.js)里:旧点号规范名进,按宿主代际出
function rpc(method, payload) { return AssemblerSDK.wire.rpc(method, payload); }
function openWs() { ws = AssemblerSDK.wire.stream(() => sessionId, handle); }
function textOf(e) { const c = e.data && e.data.message && e.data.message.content;
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.map((b) => b && b.type === 'text' ? b.text : '').join(''); return ''; }
function ensureAgentBubble() {
  if (agentBubble) return;
  const wrap = document.createElement('div'); wrap.className = 'flex';
  const b = document.createElement('div');
  b.className = 'prewrap max-w-[86%] rounded-2xl rounded-tl-md border border-border bg-card px-4 py-2';
  wrap.appendChild(b); lane.appendChild(wrap);
  const tr = document.createElement('div'); tr.className = 'flex flex-wrap gap-1';
  lane.appendChild(tr);
  agentBubble = b; toolRow = tr;
}
function handle(e) {
  if (e.type === 'assistant/message') {
    const t = textOf(e); if (t === '') return;
    ensureAgentBubble();
    agentBubble.textContent += (agentBubble.textContent === '' ? '' : '\n') + t;
    lane.parentElement.scrollTop = lane.parentElement.scrollHeight;
  } else if (e.type === 'tool/call') {
    ensureAgentBubble();
    const name = (e.data && e.data.name || '?').replace(/^mcp__/, '').replace(/__/, ' · ');
    const chip = document.createElement('span'); chip.className = 'uk-badge uk-badge-secondary'; chip.textContent = '🔧 ' + name;
    toolRow.appendChild(chip);
  } else if (e.type === 'turn/end') { setBusy(false); agentBubble = null; toolRow = null; }
}
async function ensureSession() {
  if (sessionId) return;
  const v = await rpc('session.create', { cwd: CFG.workdir, agentPreset: CFG.presetId });
  sessionId = v.sessionId; openWs();
  await new Promise((r) => { const t = setInterval(() => { if (ws && ws.readyState === 1) { clearInterval(t); r(); } }, 50); });
}
async function send() {
  const text = box.value.trim();
  if (text === '' || busy) return;
  const empty = $('empty'); if (empty) empty.remove();
  box.value = ''; box.style.height = 'auto';
  const wrap = document.createElement('div'); wrap.className = 'flex justify-end';
  const b = document.createElement('div');
  b.className = 'prewrap max-w-[86%] rounded-2xl rounded-tr-md bg-primary text-primary-foreground px-4 py-2';
  b.textContent = text; wrap.appendChild(b); lane.appendChild(wrap);
  lane.parentElement.scrollTop = lane.parentElement.scrollHeight;
  setBusy(true);
  try { await ensureSession(); await rpc('session.prompt', { sessionId, mode: 'queue', content: [{ type: 'text', text }] }); }
  catch (err) { setBusy(false); showErr(String(err && err.message || err)); }
}
sendBtn.onclick = send;
box.addEventListener('keydown', (e) => { if (e.isComposing || e.keyCode === 229) return; if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 160) + 'px'; });
$('newBtn').onclick = () => { sessionId = null; agentBubble = null; if (ws) ws.close(); lane.innerHTML = ''; setBusy(false); dot.className = 'dot'; };
</script>
</body>
</html>
